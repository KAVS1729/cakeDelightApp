name: Build and Push Microservice Images

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # latest version

      - name: Login to Docker Hub
        uses: docker/login-action@v3   # latest version
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5   # latest version
        with:
          context: ./apiGatewayMicroservice
          push: true
          tags: kavscnm/cakedelight_app:api-gateway-v1.0.0

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./orderService
          push: true
          tags: kavscnm/cakedelight_app:order-service-v1.0.0

      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./notificationService
          push: true
          tags: kavscnm/cakedelight_app:notification-service-v1.0.0

      
      - name: Build and push Cake Catalog
        uses: docker/build-push-action@v5
        with:
          context: ./cakeCatalog
          push: true
          tags: kavscnm/cakedelight_app:cake-catalog-v1.0.0

          
      - name: Build and push Rating Service
        uses: docker/build-push-action@v5
        with:
          context: ./ratingService
          push: true
          tags: kavscnm/cakedelight_app:rating-service-v1.0.0
        
