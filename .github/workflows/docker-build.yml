name: Build and Push Microservice Images

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # updated to latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3   # updated to latest
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5   # updated to latest
        with:
          context: ./apiGatewayMicroservice
          push: true
          tags: kavs1729/cake-delight-app:api-gateway

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./orderService
          push: true
          tags: kavs1729/cake-delight-app:order-service

      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./notificationService
          push: true
          tags: kavs1729/cake-delight-app:notification-service

      - name: Build and push Rating Service
        uses: docker/build-push-action@v5
        with:
          context: ./ratingService
          push: true
          tags: kavs1729/cake-delight-app:rating-service

      - name: Build and push Cake Catalog
        uses: docker/build-push-action@v5
        with:
          context: ./cakeCatalog
          push: true
          tags: kavs1729/cake-delight-app:cake-catalog
